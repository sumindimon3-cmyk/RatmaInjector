cat > "$ROOT/app/build.gradle" << 'EOF'
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ratma.injector'
    compileSdk 34

    defaultConfig {
        applicationId "com.ratma.injector"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    packaging {
        jniLibs.useLegacyPackaging = true

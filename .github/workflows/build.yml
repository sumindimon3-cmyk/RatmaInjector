name: Build Ratma APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK packages
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Verify project files
        run: |
          echo "=== root ==="
          ls -la
          echo "=== settings.gradle ==="
          cat settings.gradle || echo "MISSING settings.gradle"
          echo "=== app/build.gradle ==="
          cat app/build.gradle || echo "MISSING app/build.gradle"
          echo "=== jniLibs ==="
          ls -la app/src/main/jniLibs/arm64-v8a/ || echo "MISSING jniLibs"
          echo "=== assets ==="
          ls -la app/src/main/assets/ || echo "MISSING assets"
          echo "=== manifest ==="
          cat app/src/main/AndroidManifest.xml || echo "MISSING manifest"

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RatmaInjector-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 14

cat > "$ROOT/app/src/main/java/com/ratma/injector/MainActivity.java" << 'EOF'
package com.ratma.injector;

import android.app.Activity;
import android.os.Bundle;
import android.os.Handler;
import android.os.Looper;
import android.view.View;
import android.widget.EditText;
import android.widget.ScrollView;
import android.widget.TextView;

import java.io.BufferedReader;
import java.io.File;
import java.io.FileOutputStream;
import java.io.InputStream;
import java.io.InputStreamReader;
import java.io.OutputStream;

public class MainActivity extends Activity {
    private TextView logView;
    private EditText processInput, soPathInput;
    private Handler mainHandler;

    @Override
    protected void onCreate(Bundle b) {
        super.onCreate(b);
        setContentView(R.layout.activity_main);
        logView = findViewById(R.id.log);
        processInput = findViewById(R.id.process_name);
        soPathInput = findViewById(R.id.so_path);
        mainHandler = new Handler(Looper.getMainLooper());

        findViewById(R.id.btn_extract).setOnClickListener(v -> new Thread(this::doExtract).start());
        findViewById(R.id.btn_check).setOnClickListener(v -> new Thread(this::doCheck).start());
        findViewById(R.id.btn_inject).setOnClickListener(v -> new Thread(this::doInject).start());

        log("RATMA ready. Extract -> Check -> INJECT.");
        log("Перед Check открой Standoff 2 и не сворачивай.");
    }

    private void log(String s) {
        mainHandler.post(() -> {
            logView.append(s + "\n");
            ScrollView sv = findViewById(R.id.scroll);
            sv.post(() -> sv.fullScroll(View.FOCUS_DOWN));
        });
    }

    private void doExtract() {
        log("=== Extract ===");
        try {
            String nativeDir = getApplicationInfo().nativeLibraryDir;
            String injectorSrc = nativeDir + "/libinjector.so";
            if (!new File(injectorSrc).exists()) {
                log("[!] libinjector.so отсутствует в APK");
                return;
            }
            runSu("cp " + injectorSrc + " /data/local/tmp/libinjector && chmod 755 /data/local/tmp/libinjector");
            log("[+] Injector -> /data/local/tmp/libinjector");
            copyAssetToTmp("libcheat.so");
            copyAssetToTmp("libc++_shared.so");
            runSu("ls -la /data/local/tmp/libinjector /data/local/tmp/libcheat.so /data/local/tmp/libc++_shared.so");
            log("[+] Extract done");
        } catch (Exception e) {
            log("[!] " + e);
        }
    }

    private void copyAssetToTmp(String name) throws Exception {
        InputStream is = getAssets().open(name);
        File tmp = new File(getCacheDir(), name);
        try (OutputStream os = new FileOutputStream(tmp)) {
            byte[] buf = new byte[8192];
            int n;
            while ((n = is.read(buf)) > 0) os.write(buf, 0, n);
        } finally { is.close(); }
        runSu("cp " + tmp.getAbsolutePath() + " /data/local/tmp/" + name
              + " && chmod 755 /data/local/tmp/" + name);
        log("[+] " + name + " -> /data/local/tmp/");
    }

    private void doCheck() {
        log("=== Check ===");
        String proc = processInput.getText().toString().trim();
        runSu("ps -A | grep -i " + proc);
    }

    private void doInject() {
        log("=== Inject ===");
        String proc = processInput.getText().toString().trim();
        String so = soPathInput.getText().toString().trim();
        runSu("/data/local/tmp/libinjector " + proc + " " + so);
    }

    private void runSu(String cmd) {
        try {
            Process p = Runtime.getRuntime().exec(new String[]{"su", "-c", cmd});
            BufferedReader out = new BufferedReader(new InputStreamReader(p.getInputStream()));
            BufferedReader err = new BufferedReader(new InputStreamReader(p.getErrorStream()));
            Thread t = new Thread(() -> {
                try {
                    String l;
                    while ((l = err.readLine()) != null) log("[e] " + l);
                } catch (Exception ignored) {}
            });
            t.start();
            String l;
            while ((l = out.readLine()) != null) log(l);
            t.join();
            p.waitFor();
        } catch (Exception e) {
            log("[!] su: " + e.getMessage());
        }
    }
}
EOF

cat > "$ROOT/.github/workflows/build.yml" << 'EOF'
name: Build Ratma APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK packages
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RatmaInjector-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 14
EOF

echo "[+] Проект создан: $ROOT"
ls -la "$ROOT"
